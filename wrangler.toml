# CompanyIntel — Cloudflare Workers + R2 deployment configuration.
#
# Deploy:   bunx wrangler deploy
# Staging:  bunx wrangler deploy -c wrangler.staging.toml --keep-vars
# Preview:  bunx wrangler dev            (local, synthetic data allowed)
#
# Secrets are NEVER stored in this file. Set them once with:
#   bunx wrangler secret put CF_ACCESS_TEAM_DOMAIN
#   bunx wrangler secret put CF_ACCESS_AUD
#   bunx wrangler secret put ALLOWED_EMAILS
#
# Step-by-step instructions: docs/deployment.md

name = "companyintel"
main = "worker/src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# No `*.workers.dev` alias for production: the application must only be reachable
# through the hostname your Cloudflare Access application protects. Add the
# production route/custom domain below when you deploy, otherwise the Worker has
# no hostname at all (Access still protects the API from any other origin, and
# every /api route verifies the Access JWT itself — this just removes the alias).
#
# [[routes]]
# pattern = "intel.example.com"
# custom_domain = true
workers_dev = false

# ---------------------------------------------------------------------------
# Static frontend (built by `bun run build`, output in ./dist)
# ---------------------------------------------------------------------------
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Requests are routed to the asset layer FIRST. With SPA handling enabled, a path
# that is not a file is answered with ./dist/index.html (or an asset 404), so
# `/api/*` would never reach this Worker and `/api/health` would return HTML.
# `run_worker_first` sends these paths to the Worker before any asset is served;
# the Worker then answers JSON for them (worker/src/index.ts + app.ts) and keeps
# serving the SPA shell through the ASSETS binding for everything else.
# tests/worker-entry-routing.test.ts reads this list and fails if it stops covering
# a real API route.
run_worker_first = ["/api", "/api/*"]

# ---------------------------------------------------------------------------
# R2 — the ONLY persistent cloud data store. Private bucket; no r2.dev URL, no
# public bucket access, no S3 credentials inside the Worker.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "COMPANY_DATA"
bucket_name = "company-intel-data"

# ---------------------------------------------------------------------------
# Indexing container (Cloudflare Containers + its Durable Object).
#
# `wrangler deploy` builds ./Dockerfile with Docker and pushes it to Cloudflare's
# managed registry; Docker (or a compatible CLI) must be running. The container has
# no public route: the Worker reaches it only through the `INDEXER_CONTAINER`
# Durable Object binding, and every admin request is checked by Cloudflare Access.
#
# `standard-1` = 0.5 vCPU, 4 GiB RAM, 8 GB ephemeral disk. That is enough because
# Cloud Pass 2 materialises ONE partition (tens of MB with 256 partitions) and
# streams it back to R2; the ~23 GB spool and ~20 GB index never touch this disk.
# ---------------------------------------------------------------------------
[[containers]]
class_name = "IndexerContainer"
image = "./Dockerfile"
instance_type = "standard-1"
max_instances = 1

[[durable_objects.bindings]]
name = "INDEXER_CONTAINER"
class_name = "IndexerContainer"

[[migrations]]
tag = "v1-indexer-container"
new_sqlite_classes = ["IndexerContainer"]

[vars]
ENVIRONMENT = "production"
APP_VERSION = "0.1.0"
# Per-identity API rate limit (requests per minute per route group).
MAX_SEARCHES_PER_MINUTE = "180"
# ONE budget for the whole indexing job, Pass 1 and Pass 2 together. Either stage
# pauses at its next durable boundary (chunk / partition batch) when the combined
# running estimate reaches it. It is not a hard billing cap (storage and
# post-snapshot requests are excluded); pause/abort remain authoritative.
CLOUD_JOB_BUDGET_USD = "30"

# Search hydration dial: company profile partitions read per search. Each read
# costs ~25 KB, so this is the query's byte ceiling (see docs/architecture.md).
# Raising it returns deeper pages for broad fuzzy searches; lowering it cuts the
# bytes and CPU of every query. The engine clamps it to 1..64.
SEARCH_MAX_HYDRATE = "16"

# Direct R2 source search (REAL DATA level 3): the byte budget PER SOURCE for one
# scan. A request can lower it, never raise it. 48 MiB is a few seconds of ranged
# reads and a fraction of a cent; increase deliberately, never automatically.
REALDATA_SCAN_MAX_MB = "48"

# ---------------------------------------------------------------------------
# Observability: keep logs; no payload logging of private contact data.
# ---------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

# ---------------------------------------------------------------------------
# Local development (`wrangler dev`).
#
# DEV_ALLOW_UNAUTHENTICATED must stay false/absent for production, and the
# Worker refuses the bypass whenever ENVIRONMENT === "production".
# ---------------------------------------------------------------------------
[env.development]
name = "companyintel-dev"
workers_dev = true

[env.development.vars]
ENVIRONMENT = "development"
APP_VERSION = "0.1.0-dev"
DEV_ALLOW_UNAUTHENTICATED = "false"
MAX_SEARCHES_PER_MINUTE = "600"
SEARCH_MAX_HYDRATE = "16"
REALDATA_SCAN_MAX_MB = "48"
